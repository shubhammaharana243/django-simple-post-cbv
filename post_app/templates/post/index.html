{% extends "post/layout.html" %}

{% block body %}
    <h1>Posts</h1>
    {% for post in posts %}
        <div class="all-posts">
            <h2>{{ post.title }}</h2>
            <span>{{ post.auther }} | </span>
            <span>{{ post.created_at }} | </span>
            <a href='{% url "detail" post.pk %}'>click to read more</a>
        </div>
        <hr>
    {% endfor %}

{% endblock body %}
